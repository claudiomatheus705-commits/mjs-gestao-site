<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MJS Gestao - Login TikTok</title>
<style>
body{font-family:system-ui,Arial,sans-serif;max-width:720px;margin:40px auto;padding:0 20px;line-height:1.6;color:#222}
code{display:block;word-break:break-all;background:#f3f3f3;padding:12px;border-radius:6px}
</style>
</head>
<body>
<h1>MJS Gestao</h1>
<div id="out">Processando...</div>
<script>
var p=new URLSearchParams(location.search);
var o=document.getElementById('out');
if(p.get('error')){o.textContent='Login nao autorizado: '+p.get('error')+' '+(p.get('error_description')||'');}
else if(p.get('code')){o.innerHTML='<p>Login com TikTok concluido. Copie o codigo abaixo e cole no app MJS Gestao:</p><code></code>';o.querySelector('code').textContent=p.get('code');}
else{o.textContent='Nenhum codigo recebido.';}
</script>
</body>
</html>
